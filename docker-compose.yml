version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: expensetracker_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Dhaka_5229##}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-expense_tracker}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - expensetracker_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expensetracker_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3006
      DATABASE_URL: "mysql://root:${MYSQL_ROOT_PASSWORD:-Dhaka_5229##}@mysql:3306/${MYSQL_DATABASE:-expense_tracker}?connection_limit=10"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-expense_tracker_jwt_access_super_secret_key_2026_!@#}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-expense_tracker_jwt_refresh_super_secret_key_2026_#@!}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: "http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3006"
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: "lax"
      DEFAULT_CURRENCY: "BDT"
      DEFAULT_TIMEZONE: "Asia/Dhaka"
    ports:
      - "3006:3006"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - expensetracker_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: expensetracker_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - expensetracker_network

  nginx:
    image: nginx:alpine
    container_name: expensetracker_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - expensetracker_network

volumes:
  mysql_data:

networks:
  expensetracker_network:
    driver: bridge
