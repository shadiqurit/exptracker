# ==============================================================================
# Nginx Configuration for exp.shadiqur.bd
#
# Production Deployment for:
# - Frontend SPA at /var/www/exptracker/frontend/dist (or D:\app\exptracker\frontend\dist)
# - Backend REST API running on port 3006
# ==============================================================================

server {
    listen 80;
    server_name exp.shadiqur.bd;

    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Frontend Static Single Page Application
    # For Linux:   /var/www/exptracker/frontend/dist
    # For Windows: D:/app/exptracker/frontend/dist
    root /var/www/exptracker/frontend/dist;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Frontend SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service Worker - no-cache so PWA updates take effect immediately
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Static Assets Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Backend REST API Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Backend Health Check
    location /health {
        proxy_pass http://127.0.0.1:3006/health;
    }
}
